version: '3'
services:
  selenium-hub:
    image: selenium/hub:4.8.0
    ports: ["4444:4444"]
  chrome:
    image: selenium/node-chrome:4.8.0
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    depends_on: ["selenium-hub"]
  appium:
    image: appium/appium
    ports: ["4723:4723"]
